source: >-
  Searched jenavalve.com and discover-ar.com for versioning, deprecation, SLA, changelog and
  status pages; probed candidate subdomains. Derived version scheme from observed routes.
summary: >-
  There is no API lifecycle to describe, because there is no API programme. JenaValve makes no
  version commitment, publishes no deprecation policy, offers no SLA, runs no status page and
  keeps no changelog. The version segments in the URL paths belong to WordPress core and its
  plugins, not to JenaValve. Any third party building against these hosts is building against
  an unversioned, uncommitted, unannounced surface that can change or disappear with a routine
  CMS update.
versioning:
  scheme: uri-path-namespace
  current: wp/v2
  other_namespaces: [oembed/1.0, yoast/v1, wp-site-health/v1, wp-block-editor/v1, wp-abilities/v1]
  owned_by: WordPress core and third-party plugins
  policy_url: null
  detail: >-
    wp/v2 is the WordPress core REST namespace and has been stable across WordPress releases
    for years, which gives the surface incidental stability — but that stability is WordPress's
    property, not a JenaValve commitment, and the plugin namespaces (CookieYes cky/v1,
    Contact Form 7, Redirection, All-in-One WP Migration ai1wm/v1, CPT UI cptui/v1,
    PublishPress Future) change with plugin updates.
