stability_risk:
  level: high
  reasons:
  - No version, deprecation or change commitment of any kind from the provider.
  - >-
    The surface is a side effect of the CMS. A plugin update, a security hardening pass or a
    platform migration could close or reshape it without any announcement.
  - >-
    Plugin namespaces present today (cky/v1, cptui/v1, ai1wm/v1, publishpress-future/v1,
    yoast/v1) exist only while those plugins remain installed.
  - No status page or support channel exists to learn about a change from.
