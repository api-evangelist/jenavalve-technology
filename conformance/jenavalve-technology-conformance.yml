notes:
  medical_device: >-
    JenaValve's Trilogy System carries a CE mark and is under FDA investigational device
    exemption in the United States, and the company runs a published Integrity and Compliance
    programme with a Code of Conduct and an EthicsPoint reporting helpline (US 1-844-539-2348,
    DE 0800 1821686, UK 0-800-89-0011). None of that is an API or information-security
    certification: no SOC 2, ISO 27001, PCI DSS, HIPAA or FedRAMP attestation is published
    anywhere on the company's public surface, no trust centre exists, and no compliance
    documentation is offered for download. For that reason no Compliance or TrustCenter pointer
    is emitted for this provider — the Integrity and Compliance page is wired as CodeOfConduct,
    which is what it actually is.
  provider_published_specs: >-
    JenaValve publishes zero machine-readable API artifacts. Everything in openapi/ was derived
    by probing and is labelled as such in each spec's info block.
