x-enrichment:
  date: '2026-08-04'
  status: enriched
  artifacts_added: 15
  pass: local-v1
  notes: >-
    No product API. Contract discovery probed jenavalve.com, discover-ar.com and
    eifu.jenavalve.com for OpenAPI on each host root, GraphQL, MCP tools/list, A2A agent cards at
    both the canonical and legacy well-known paths, and the full /.well-known/ set — every one
    404 on the two WordPress hosts. eifu.jenavalve.com is a Next.js SPA on the third-party
    ifucare.io platform whose catch-all answers 200 with an identical 2,454-byte HTML shell for
    every path including both agent-card paths; those were recorded as false positives, not hits,
    and no agent card was written. The real machine-readable contracts are the two anonymous
    WordPress REST APIs — jenavalve.com/wp-json (12 namespaces, 242 routes) and
    discover-ar.com/wp-json (8 namespaces, 197 routes). Their access posture is the inverse of
    the hardened WordPress pattern: every standard wp/v2 content collection is wide open
    anonymously while the administrative routes correctly 401 (wp/v2/settings, block-types,
    menu-items, wp-abilities, wp-site-health, CookieYes) and Contact Form 7 403s. Two OpenAPI 3.1
    documents were derived from the route indexes plus direct probing of every described
    operation — 24 verified anonymous operations on the main site, 18 on Discover AR. The one
    genuinely editorial signal across both is Discover AR's category taxonomy, which segments the
    aortic-regurgitation education library by media format (articles 4, videos 6, audio 3,
    presentations 0). Searched and found no VDP, no bug bounty, no trust center, no named
    security or privacy certification, no GitHub org, no packages, no CLI, no MCP server, no
    changelog, no status page, no webhook or event surface, and no developer/api/docs/status/trust
    subdomain resolving. Those artifacts were deliberately not written rather than stubbed. Domain
    security probe found TLS 1.3 on both hosts but no HSTS, no DNSSEC and no CAA on either, DMARC
    at p=none on jenavalve.com and no DMARC at all on discover-ar.com. No idempotency contract
    exists, so no Idempotency pointer was emitted; likewise no StatusPage, Deprecation, Security,
    Compliance, SDKs, Postman, MCPServer, Webhooks or AgentCard pointer, because none of those
    things exist. The Integrity and Compliance page is a Code of Conduct plus an EthicsPoint
    helpline with no named certification, so it is wired as CodeOfConduct rather than Compliance.
