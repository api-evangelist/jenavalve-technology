- name: JenaValve Discover AR Site API (WordPress REST)
  description: 'Anonymously readable REST surface served by discover-ar.com at /wp-json — 197 routes
    across 8 namespaces. Discover AR is JenaValve''s aortic-regurgitation education site, linked
    from the jenavalve.com navigation as "Resources". Its one genuinely editorial signal is a
    purpose-built category taxonomy that segments a 13-item education library by media format —
    articles (4), videos (6), audio (3) and presentations (0) — making the library retrievable by
    format without scraping HTML. Also anonymous: 9 pages, 63 media items, cross-type site search,
    oEmbed, and the Yoast SEO get_head endpoint, which returns rendered head metadata including
    schema.org JSON-LD for any URL on the site. wp/v2/settings returns 401. As with the main site
    this is an incidental CMS surface with no published documentation, keys or support.'
