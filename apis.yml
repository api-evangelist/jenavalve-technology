aid: jenavalve-technology
name: JenaValve Technology
description: 'JenaValve Technology, Inc. is a privately held medical-device company headquartered
  at 4 Cromwell, Irvine, California, with an EU headquarters in the Central Tower, Landsberger
  Str. 110, Munich and a UK office at Unit 9A Astley Way, Swillington, Leeds. Founded in 2006 on
  a concept developed in 1995 by Professors Hans Figulla and Markus Ferrari, it develops the
  Trilogy Heart Valve System, a transcatheter aortic valve replacement (TAVR) device purpose-built
  for the minimally invasive treatment of severe aortic regurgitation (AR) as well as aortic
  stenosis (AS), delivered transfemorally and transapically with a porcine pericardial valve. The
  system carries a CE mark and is an investigational device in the United States, supported by the
  ALIGN-AR and ARTIST clinical studies and the JENA-VAD registry. The company has raised roughly
  $364 million across 13 rounds from investors including Bain Capital Life Sciences, the Qatar
  Investment Authority, Pictet Alternative Advisors, Innovatus Capital Partners and Peijia Medical.
  JenaValve operates no developer API programme — there is no developer portal, no API
  documentation, no keys, no SDKs, no CLI, no MCP server, no agent card, no changelog and no status
  page, and no developer, api, docs, status or trust subdomain resolves. Its two corporate
  WordPress sites do each serve an anonymously readable REST API, and on both of them the standard
  content collections are wide open while the administrative routes are correctly locked to 401.'
