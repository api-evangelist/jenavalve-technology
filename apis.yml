apis:
- name: JenaValve Site API (WordPress REST)
  description: 'Anonymously readable REST surface served by jenavalve.com at /wp-json — 242 routes
    across 12 namespaces. The standard WordPress content collections all answer without
    credentials: 38 news posts (segmented by a four-term category taxonomy of press, videos,
    experts and uncategorized), 18 pages covering the Trilogy System, investors, careers and the
    ALIGN-AR / ARTIST / JENA-VAD clinical study pages, 137 media items including the Trilogy
    product brochure and the 2026 reimbursement guide, a cross-type site search, two public author
    bylines, and the oEmbed provider endpoint. Administrative routes are correctly closed —
    wp/v2/settings, wp/v2/block-types, wp/v2/menu-items, wp-site-health/v1, wp-abilities/v1/abilities
    and the CookieYes settings routes all return 401, and the Contact Form 7 routes return 403. A
    custom events post type is registered but empty. This is an incidental CMS surface, not an API
    product: JenaValve publishes no documentation, keys, SDKs, support channel, rate-limit policy,
    status page or terms of use for it.'
  humanURL: https://jenavalve.com/news/
